name: Publish preview after all three gates
on:
  workflow_run:
    workflows:
      - Build and test Windows installer
      - Real Office and OCR document integration
      - Chromium UI and memory acceptance
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: opendesk-public-preview-release
  cancel-in-progress: false
jobs:
  publish-if-fully-tested:
    # Never publish from a pull_request or a non-main workflow_run.
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require three successful push workflows for EXACT main HEAD
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$latest" != "$SOURCE_SHA" ]; then
            echo "Main has advanced; no release from old commit."
            exit 0
          fi
          runs="$(gh api "repos/$REPO/actions/runs?head_sha=$SOURCE_SHA&event=push&per_page=100")"
          for name in 'Build and test Windows installer' 'Real Office and OCR document integration' 'Chromium UI and memory acceptance'; do
            records="$(printf '%s' "$runs" | jq -c --arg name "$name" --arg sha "$SOURCE_SHA" '[.workflow_runs[]|select(.name==$name and .event=="push" and .head_branch=="main" and .head_sha==$sha)]')"
            # GitHub may schedule multiple push workflow runs for the same
            # HEAD. Use the newest run for every gate, never an earlier PASS
            # to hide a newer failure/pending rerun.
            count="$(printf '%s' "$records" | jq 'length')"
            latest="$(printf '%s' "$records" | jq -c 'sort_by(.created_at, .run_number, .id) | last // null')"
            status="$(printf '%s' "$latest" | jq -r '.conclusion // "pending"')"
            state="$(printf '%s' "$latest" | jq -r '.status // "pending"')"
            if [ "$count" -lt 1 ] || [ "$state" != completed ] || [ "$status" != success ]; then
              echo "$name: newest run $state/$status ($count matching runs). Release BLOCKED."
              exit 0
            fi
            if [ "$name" = 'Build and test Windows installer' ]; then
              run_id="$(printf '%s' "$latest" | jq -r '.id')"
            fi
          done
          echo "windows_run=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Download Windows EXE artifacts from tested SHA
        if: steps.gates.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WINDOWS_RUN: ${{ steps.gates.outputs.windows_run }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$WINDOWS_RUN" -R "$REPO" -n OpenDeskFree-Windows-v0.6.7_preview1 -D dist
          cd dist
          sha256sum --check SHA256SUMS.txt
          test -s OpenDeskFree_Setup_0.6.7_preview1.exe
          test -s OpenDeskFree_Portable_0.6.7_preview1.exe
      - name: Publish unsigned preview only once, from fully tested SHA
        if: steps.gates.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.gates.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          [ "$current" = "$SOURCE_SHA" ] || { echo 'Main changed; no release'; exit 0; }
          tag='v0.6.7-preview.1'
          if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite."
            exit 0
          fi
          gh api "repos/$REPO/contents/docs/RELEASE_NOTES_V0.6.7_PREVIEW1.md?ref=$SOURCE_SHA" --jq .content | base64 -d > release-notes.md
          gh release create "$tag" dist/*.exe dist/SHA256SUMS.txt -R "$REPO" --target "$SOURCE_SHA" --title 'OpenDesk Free v0.6.7 Preview 1' --notes-file release-notes.md --prerelease
