name: Build and test Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve PDF dependencies
        run: go mod tidy
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $html = Get-Content cmd/opendesk/web/index.html -Raw
          $script = [regex]::Match($html, '(?s)<script>(.*?)</script>').Groups[1].Value
          Set-Content "$env:RUNNER_TEMP/opendesk-ui.js" $script -Encoding utf8
          node --check "$env:RUNNER_TEMP/opendesk-ui.js"
      - name: Verify bilingual UI and external catalog
        run: node --test tests/*.test.mjs
      - name: Build Windows application (GUI, no console)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o cmd/setup/payload/OpenDeskFree.exe ./cmd/opendesk
          Copy-Item cmd/setup/payload/OpenDeskFree.exe dist/OpenDeskFree_Portable_0.6.5_preview1.exe
      - name: Run automated tests
        run: go test ./...
      - name: Vet Go source
        run: go vet ./...
      - name: Runtime smoke test for actual Windows Portable EXE
        run: node --test tests/windows-runtime.smoke.mjs
      - name: Build Windows setup executable
        shell: pwsh
        run: |
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o dist/OpenDeskFree_Setup_0.6.5_preview1.exe ./cmd/setup
          Copy-Item go.sum dist/go.sum -Force
          Get-FileHash dist/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path -Leaf $_.Path)" } | Out-File dist/SHA256SUMS.txt -Encoding utf8
      - name: Windows Setup installation/upgrade/uninstall acceptance
        run: node --test tests/windows-installer.acceptance.mjs
      - name: Upload installer build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenDeskFree-Windows-v0.6.5_preview1
          path: dist/*
          if-no-files-found: error
          retention-days: 30


  windows-defender-antivirus:
    name: Defender malware scan on Windows 11 (exact x64 artifacts)
    needs: windows-release
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download exact built Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: OpenDeskFree-Windows-v0.6.5_preview1
          path: dist
      - name: Verify hashes from Windows build before scanning
        shell: pwsh
        run: |
          $rows = Get-Content dist/SHA256SUMS.txt
          foreach ($name in @('OpenDeskFree_Setup_0.6.5_preview1.exe','OpenDeskFree_Portable_0.6.5_preview1.exe')) {
            $record = @($rows | Where-Object { $_ -like "*$name" })
            if ($record.Count -ne 1) { throw "SHA manifest missing or duplicate: $name" }
            $expected = ($record[0] -split '\\s+')[0].Trim().ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath ("dist/" + $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "Build artifact SHA mismatch: $name" }
          }
      - name: Antivirus security gate (both exact built EXEs)
        shell: pwsh
        run: |
          ./scripts/defender-release-scan.ps1 -Paths @(
            'dist/OpenDeskFree_Portable_0.6.5_preview1.exe',
            'dist/OpenDeskFree_Setup_0.6.5_preview1.exe'
          ) -ReportPath 'dist/ANTIVIRUS_SCAN.json'
      - name: Keep AV scan evidence even when security gate blocks release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenDeskFree-Windows-AV-Evidence
          path: dist/ANTIVIRUS_SCAN.json
          if-no-files-found: warn
          retention-days: 30
