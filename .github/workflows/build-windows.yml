name: Build and test Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve PDF dependencies
        run: go mod tidy
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $html = Get-Content cmd/opendesk/web/index.html -Raw
          $script = [regex]::Match($html, '(?s)<script>(.*?)</script>').Groups[1].Value
          Set-Content "$env:RUNNER_TEMP/opendesk-ui.js" $script -Encoding utf8
          node --check "$env:RUNNER_TEMP/opendesk-ui.js"
      - name: Verify bilingual UI translations
        run: node --test tests/i18n.test.mjs
      - name: Build Windows application (GUI, no console)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o cmd/setup/payload/OpenDeskFree.exe ./cmd/opendesk
          Copy-Item cmd/setup/payload/OpenDeskFree.exe dist/OpenDeskFree_Portable_0.2.0_preview1.exe
      - name: Run automated tests
        run: go test ./...
      - name: Vet Go source
        run: go vet ./...
      - name: Build Windows setup executable
        shell: pwsh
        run: |
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o dist/OpenDeskFree_Setup_0.2.0_preview1.exe ./cmd/setup
          Copy-Item go.sum dist/go.sum -Force
          Get-FileHash dist/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path -Leaf $_.Path)" } | Out-File dist/SHA256SUMS.txt -Encoding utf8
      - name: Upload installer build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenDeskFree-Windows-v0.2.0_preview1
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish one public preview release after passing all gates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.2.0-preview.1'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Preview release already exists. No replacement without version bump."
            exit 0
          }
          $files = @(Get-ChildItem dist -File -Filter '*.exe' | ForEach-Object { $_.FullName })
          $files += (Resolve-Path dist/SHA256SUMS.txt).Path
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'OpenDesk Free v0.2.0 Preview 1' --notes-file 'docs/RELEASE_NOTES_V0.2.0_PREVIEW1.md' --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub preview release publish failed' }
